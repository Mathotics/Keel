name: Version tag

on:
  push:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  tag:
    name: Publish version tag
    runs-on: ubuntu-latest
    steps:
      - name: Create the version-control app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KEEL_VERSION_APP_ID }}
          private-key: ${{ secrets.KEEL_VERSION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - name: Publish the version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/version_tag.py publish
