{% extends "base.html" %}
{% block title %}New issue{% endblock %}
{% block main %}
      <h1>New issue in {{ project.key }}</h1>

      {% if error %}
      <p class="keel-error" role="alert">{{ error }}</p>
      {% endif %}

      <form class="keel-form keel-form--stacked" method="post" action="/web/projects/{{ project.id }}/issues">
        <p>
          <label for="issue-type">Type</label>
          <select id="issue-type" name="type">
            {% for value in ["epic", "story", "subtask"] %}
            <option value="{{ value }}">{{ value | label }}</option>
            {% endfor %}
          </select>
        </p>
        <p>
          <label for="issue-title">Title</label>
          <input id="issue-title" name="title" type="text" maxlength="300" required/>
        </p>
        <p>
          <label for="issue-description">Description</label>
          <textarea id="issue-description" name="description" rows="4"></textarea>
        </p>
        <p>
          <label for="issue-status">Status</label>
          <select id="issue-status" name="status">
            {% for value in ["todo", "in_progress", "in_review", "blocked", "done"] %}
            <option value="{{ value }}">{{ value | label }}</option>
            {% endfor %}
          </select>
        </p>
        <p>
          <label for="issue-parent">Parent</label>
          <select id="issue-parent" name="parent_id">
            <option value="">No parent</option>
            {% for candidate in parents %}
            <option value="{{ candidate.id }}">{{ project.key }}-{{ candidate.number }} ({{ candidate.type | label }}) {{ candidate.title }}</option>
            {% endfor %}
          </select>
        </p>
        <p>
          <label for="issue-assignee">Assignee</label>
          <select id="issue-assignee" name="assignee_id">
            <option value="">Unassigned</option>
            {% for person in assignees %}
            <option value="{{ person.id }}">{{ person.display_name }}</option>
            {% endfor %}
          </select>
        </p>
        <p>
          <label for="issue-sprint">Sprint</label>
          <select id="issue-sprint" name="sprint_id">
            <option value="">Unscheduled</option>
            {% for sprint in sprints %}
            <option value="{{ sprint.id }}">{{ sprint.name }} ({{ sprint.state | label }})</option>
            {% endfor %}
          </select>
        </p>
        <p>
          <label for="issue-due">Due date</label>
          <input id="issue-due" name="due_at" type="datetime-local"/>
        </p>
        <p>
          <label for="issue-estimate">Estimate</label>
          <input id="issue-estimate" name="estimate" type="text" placeholder="2h, 90m, 1h 30m, or 1d"/>
        </p>
        <p>
          <label for="issue-remaining">Remaining</label>
          <input id="issue-remaining" name="remaining" type="text" placeholder="2h, 90m, 1h 30m, or 1d"/>
        </p>
        {% if current_user %}
        <input type="hidden" name="reporter_id" value="{{ current_user.id }}"/>
        {% endif %}
        <p><button type="submit">Create issue</button></p>
      </form>
{% endblock %}
