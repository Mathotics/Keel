<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Forgot password — Keel</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="/assets/brand.css"/>
  </head>
  <body>
    <main class="keel-main">
      <h1>Forgot password</h1>
      {% if notice %}
      <p class="keel-note" role="status">{{ notice }}</p>
      {% endif %}
      {% if error %}
      <p class="keel-error" role="alert">{{ error }}</p>
      {% endif %}
      <div class="keel-panel">
        <form class="keel-form keel-form--stacked" method="post" action="/forgot-password">
          <div class="keel-fields">
            <p class="keel-fields__full">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" maxlength="100" required autocomplete="username" spellcheck="false"/>
            </p>
          </div>
          <p class="keel-form-actions"><button class="keel-primary" type="submit">Send reset link</button></p>
        </form>
      </div>
      <p><a href="/login">Back to sign in</a></p>
    </main>
    <footer class="keel-footer">
      <a class="keel-footer__copyright" href="/license">{{ copyright_notice }}</a>
      <p class="keel-footer__version">Keel {{ version }}</p>
    </footer>
  </body>
</html>
