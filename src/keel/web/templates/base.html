<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block title %}Keel{% endblock %}</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon"/>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="/assets/brand.css"/>
    {% block scripts %}
    <script src="/assets/js/userpicker.js" defer></script>
    <script src="/assets/js/nav.js" defer></script>
    {% endblock %}
  </head>
  <body>
    <header class="keel-topbar">
      <a class="keel-topbar__home" href="/" aria-label="Keel home">
        <img src="/assets/small_icon.png" alt=""/>
      </a>
      <nav class="keel-topbar__nav" aria-label="Sections" data-keel-nav-root>
        {% for item in nav_items %}
        <span class="keel-nav__item" data-keel-nav-item="{{ item.key }}">
          <a class="keel-topbar__control{% if item.modifier %} {{ item.modifier }}{% endif %}" href="{{ item.href }}" data-keel-nav-handle>{{ item.label }}</a>
          <form class="keel-nav__fallback" method="post" action="/web/nav/move">
            <input type="hidden" name="item" value="{{ item.key }}"/>
            <input type="hidden" name="visible" value="{{ nav_keys }}"/>
            <input type="hidden" name="next" value="{{ request.url.path }}"/>
            <button class="keel-topbar__control" name="direction" value="up">Up</button>
            <button class="keel-topbar__control" name="direction" value="down">Down</button>
          </form>
        </span>
        {% endfor %}
      </nav>
      <form class="keel-find" method="get" action="/search" role="search">
        <label class="keel-visually-hidden" for="keel-find">Find</label>
        <input class="keel-topbar__control" id="keel-find" name="q" type="search"
               required placeholder="Find" value="{{ find_query }}"/>
        {% if project %}
        <input type="hidden" name="project" value="{{ project.key }}"/>
        {% endif %}
        <button class="keel-topbar__control keel-find__fallback" type="submit">Find</button>
      </form>
      <div class="keel-topbar__right">
        <details class="keel-help">
          <summary class="keel-topbar__control">Help</summary>
          <div class="keel-help__menu">
            <a class="keel-topbar__control" href="/docs" target="_blank" rel="noopener">FastAPI Docs</a>
            <a class="keel-topbar__control" href="/redoc" target="_blank" rel="noopener">ReDoc</a>
          </div>
        </details>
        {% if users %}
        <form class="keel-userpicker" method="post" action="/web/user">
          <input type="hidden" name="next" value="{{ request.url.path }}"/>
          <label class="keel-userpicker__label" for="keel-user">Acting as</label>
          <select class="keel-topbar__control" id="keel-user" name="user">
            {% for user in users %}
            <option value="{{ user.id }}"{% if current_user and user.id == current_user.id %} selected{% endif %}>{{ user.display_name }}</option>
            {% endfor %}
          </select>
          <button class="keel-topbar__control keel-userpicker__fallback" type="submit">Switch</button>
        </form>
        {% endif %}
      </div>
    </header>
    <main class="keel-main">
{% block main %}{% endblock %}
    </main>
    <footer class="keel-footer">
      <a class="keel-footer__copyright" href="/license">{{ copyright_notice }}</a>
      <p class="keel-footer__version">Keel {{ version }}</p>
    </footer>
  </body>
</html>
