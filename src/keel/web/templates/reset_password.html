<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Choose a new password — Keel</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="/assets/brand.css"/>
  </head>
  <body>
    <main class="keel-main">
      <h1>Choose a new password</h1>
      {% if invalid %}
      <p class="keel-error" role="alert">{{ invalid }}</p>
      <p><a href="/forgot-password">Request a new link</a></p>
      {% else %}
      {% if error %}
      <p class="keel-error" role="alert">{{ error }}</p>
      {% endif %}
      <div class="keel-panel">
        <form class="keel-form keel-form--stacked" method="post" action="/reset-password">
          <input type="hidden" name="token" value="{{ token }}"/>
          <div class="keel-fields">
            <p class="keel-fields__full">
              <label for="new-password">New password</label>
              <input id="new-password" name="new_password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"/>
            </p>
            <p class="keel-fields__full">
              <label for="confirm-password">Confirm password</label>
              <input id="confirm-password" name="confirm_password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"/>
            </p>
          </div>
          <p class="keel-form-actions"><button class="keel-primary" type="submit">Save password</button></p>
        </form>
      </div>
      {% endif %}
    </main>
    <footer class="keel-footer">
      <a class="keel-footer__copyright" href="/license">{{ copyright_notice }}</a>
      <p class="keel-footer__version">Keel {{ version }}</p>
    </footer>
  </body>
</html>
