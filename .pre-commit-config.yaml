repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - fastapi==0.116.1
          - pydantic-settings==2.10.1
          - uvicorn[standard]==0.35.0
          - sqlalchemy==2.0.52
          - alembic==1.19.1
          - jinja2==3.1.6
          - platformdirs==4.11.5
          - python-multipart==0.0.32
          - httpx==0.28.1
          - pytest==8.4.1
        args: [src, tests]
        pass_filenames: false
  - repo: local
    hooks:
      - id: pytest-coverage
        name: tests (90% coverage)
        language: system
        entry: pytest --cov=keel --cov-report=term-missing --cov-fail-under=90
        pass_filenames: false
        always_run: true
